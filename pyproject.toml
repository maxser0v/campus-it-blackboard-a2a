[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "campus-blackboard"
version = "0.1.0"
description = "A campus IT incident investigator built on A2A and a persistent Blackboard."
requires-python = ">=3.11,<3.12"
dependencies = [
    "a2a-sdk[fastapi]==1.3.0",
    "httpx>=0.27,<1",
    "langchain>=1,<2",
    "langgraph>=1,<2",
    "python-dotenv>=1.0,<2",
    "streamlit>=1.40,<2",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/campus_blackboard"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: starts local A2A services in separate processes"]

